name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/a-mini-siem-platform

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - run: go test ./...

  build-and-push:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend
          tags: type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

  integration:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Start integration stack
        run: docker compose up -d --build postgres redis elasticsearch backend
      - name: Wait for backend
        run: |
          for attempt in $(seq 1 30); do
            curl --fail http://localhost:8080/healthz && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Run integration tests
        working-directory: backend
        env:
          INTEGRATION_API_URL: http://localhost:8080
          INTEGRATION_REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration ./integration
      - if: always()
        run: docker compose down -v

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}
            docker compose pull backend frontend
            docker compose up -d backend frontend

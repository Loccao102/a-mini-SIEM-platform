name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  production-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/production-preflight.test.mjs scripts/vps-smoke.test.mjs scripts/vps-release.test.mjs scripts/vps-backup.test.mjs
      - run: node --check scripts/production-preflight.mjs
      - run: node --check scripts/vps-smoke.mjs
      - run: node --check scripts/vps-release.mjs
      - run: node --check scripts/vps-backup.mjs
      - run: docker compose config --quiet
      - run: docker compose --profile production config --quiet
      - name: Validate production Caddyfile
        run: docker run --rm -e SIEM_DOMAIN=siem.example.org -e ACME_EMAIL=ops@example.org -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start isolated test dependencies and migrations
        run: docker compose -p siem-ci up -d --wait --wait-timeout 120 postgres redis
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Tests and race detector
        working-directory: backend
        run: go test -race -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
      - name: Dependency logs
        if: failure()
        run: docker compose -p siem-ci logs --no-color --tail=150
      - name: Clean isolated test stack
        if: always()
        run: docker compose -p siem-ci down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
      JWT_SECRET: ci-only-jwt-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start complete ingest pipeline
        run: docker compose -p siem-integration up -d --build --wait --wait-timeout 300 postgres redis elasticsearch backend
      - name: Test authenticated ingest, indexing and RBAC
        working-directory: backend
        env:
          INTEGRATION_ADMIN_PASSWORD: ci-only-admin-password
        run: go test -tags=integration -count=1 -timeout=3m -v ./integration
      - name: Pipeline logs
        if: failure()
        run: docker compose -p siem-integration logs --no-color --tail=200
      - name: Clean isolated pipeline
        if: always()
        run: docker compose -p siem-integration down -v

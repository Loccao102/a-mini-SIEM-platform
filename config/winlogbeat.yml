winlogbeat.event_logs:
  - name: Security
    ignore_older: 72h
  - name: System
    ignore_older: 72h

processors:
  - add_host_metadata: ~
  - add_fields:
      target: ""
      fields:
        source_type: windows_eventlog

output.logstash:
  hosts: ["${SIEM_BEATS_HOST:localhost}:5044"]

# Winlogbeat does not support output.http. Logstash receives Beats events on
# port 5044 and forwards them to the SIEM HTTP ingest endpoint.
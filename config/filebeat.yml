filebeat.inputs:
  - type: filestream
    id: linux-system-logs
    paths:
      - /var/log/auth.log
      - /var/log/syslog
    fields:
      source_type: linux_sshd
    fields_under_root: true

processors:
  - add_host_metadata: ~

output.logstash:
  hosts: ["${SIEM_BEATS_HOST:localhost}:5044"]

# Filebeat does not support output.http. Logstash receives Beats events on
# port 5044 and forwards them to the SIEM HTTP ingest endpoint.
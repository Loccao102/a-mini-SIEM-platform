# Docker Compose Horizontal Scaling Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml config
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale backend=2

services:
  gateway:
    image: nginx:alpine
    container_name: siem-gateway
    mem_limit: 64m
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${API_PORT:-8080}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    ports: !reset []
